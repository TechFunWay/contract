# 部署文件（随发行产物分发）
# 本文件由发行脚本复制到 release/<版本>/ 目录，镜像版本号自动替换为当前版本。
#
# 用法：
#   cd release/<版本>
#   docker compose up -d
#
# 镜像说明：
#   - 本机已构建：make build-docker 生成 techfunways/contract:<版本>
#   - 远程部署：需先将对应版本镜像推送到镜像仓库后再拉取
#
# 升级方式：
#   切换到新版本发行目录后执行 docker compose up -d；
#   数据（SQLite/上传文件/日志/配置）持久化在 named volume 中，升级不丢数据。
services:
  techfunway-contract:
    image: techfunways/contract:v0.2.0
    container_name: techfunway-contract
    ports:
      - "8911:8911"
    volumes:
      # 数据库、上传文件、日志和配置均持久化在此卷中。
      - contract-data:/app/data
    environment:
      - ENV=release
      - DATA_DIR=/app/data
      # device-type=docker 仅用于匿名统计的平台分布；DISABLE_STATS=1 可完全关闭上报
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

volumes:
  contract-data:
